name: Terraform CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - master_new
  pull_request:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_LOG: TRACE
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
        # Если используется Terraform Cloud/Enterprise
          cli_config_credentials_token: ${{ secrets.PROVIDER_TOKEN }}

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ./Task2Advanced/
        # Учетные данные провайдера могут быть переданы через переменные окружения,
        # которые GitHub Actions автоматически загрузит из секретов.
        env:
          TF_VAR_provider_token: ${{ secrets.PROVIDER_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./Task2Advanced/
        env:
          TF_VAR_provider_token: ${{ secrets.PROVIDER_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-artifact
          path: Task2Advanced/tfplan

      - name: Terraform Apply
        # Запускается только при слиянии в main (push event),
        # а не при создании pull request.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_provider_token: ${{ secrets.PROVIDER_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}